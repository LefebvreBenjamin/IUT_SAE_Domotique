[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/archive/refs/heads/main.zip
board = esp32-c6-devkitc-1
framework = arduino
lib_deps = miguelbalboa/MFRC522@^1.4.12
monitor_speed = 115200
